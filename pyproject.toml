[project]
name = "stock-recommender"
version = "0.1.0"
description = "Stock recommendation research dashboard and point-in-time backtest tools"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stock_recommender*"]

[tool.pytest.ini_options]
pythonpath = ["."]
